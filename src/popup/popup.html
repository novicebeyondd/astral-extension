<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Astral</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="popup__header">
        <div class="popup__identity">
          <span class="popup__mark"><img src="../../assets/icon-128.png" alt=""></span>
          <span><strong>ASTRAL</strong><small>DISCORD WEB CONTROL</small></span>
        </div>
        <span class="popup__version">1.0</span>
      </header>
      <section class="popup__hero">
        <span class="popup__eyebrow">READY TO CONNECT</span>
        <h1>Your audio,<br><em>your orbit.</em></h1>
        <p>Open Discord Web and launch the Astral panel from the lower-right corner.</p>
      </section>
      <section class="popup__status">
        <span class="popup__status-dot"></span>
        <span id="status">Checking Discord Web</span>
      </section>
      <div class="popup__actions">
        <button id="open" class="popup__button popup__button--primary" type="button">OPEN ASTRAL</button>
        <button id="power" class="popup__button" type="button">TOGGLE PROCESSING</button>
      </div>
      <footer class="popup__footer">
        <span>LOCAL ONLY</span>
        <span class="popup__shortcut"><kbd>CTRL</kbd><kbd>SHIFT</kbd><kbd>A</kbd></span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
